let active = "အားလုံး";
const money = n => "Ks " + Number(n).toLocaleString("en-US");
const chips = document.getElementById("chips");
const menu = document.getElementById("menu");
const search = document.getElementById("search");
function renderChips(){
  chips.innerHTML = "";
  ["အားလုံး", ...categories].forEach(c => {
    const b=document.createElement("button");
    b.textContent=c; b.className=c===active?"active":"";
    b.onclick=()=>{active=c;renderChips();renderMenu();};
    chips.appendChild(b);
  });
}
function renderMenu(){
  const q=search.value.trim().toLocaleLowerCase();
  const filtered=items.filter(x=>(active==="အားလုံး"||x.category===active) && (x.name.toLocaleLowerCase().includes(q)||x.category.toLocaleLowerCase().includes(q)));
  menu.innerHTML="";
  if(!filtered.length){menu.innerHTML='<div class="empty">ရှာဖွေတွေ့ရှိမှု မရှိပါ။</div>';return;}
  const groups=[...new Set(filtered.map(x=>x.category))];
  groups.forEach(cat=>{
    const section=document.createElement("section");section.className="group";
    const h=document.createElement("h2");h.textContent=cat;section.appendChild(h);
    filtered.filter(x=>x.category===cat).forEach(x=>{
      const row=document.createElement("div");row.className="item";
      const n=document.createElement("div");n.className="name";n.textContent=x.name;
      const p=document.createElement("div");p.className="price";p.textContent=money(x.price);
      row.append(n,p);section.appendChild(row);
    });
    menu.appendChild(section);
  });
}
