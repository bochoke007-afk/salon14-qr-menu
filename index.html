<!doctype html>
<html lang="my">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#303f91">
<title>Salon14 Foods & Cold Drinks | Menu</title>
<style>
:root{--navy:#303f91;--ink:#202334;--muted:#687083;--line:#e8eaf0;--bg:#f5f6fa;--white:#fff;--accent:#b94b3d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans Myanmar","Myanmar Text",sans-serif}
header{background:linear-gradient(135deg,#303f91,#4859b5);color:white;padding:26px 18px 22px;text-align:center}
.brand{font-size:27px;font-weight:800;letter-spacing:.4px}
.sub{font-size:12px;letter-spacing:2px;margin-top:5px;opacity:.9}
.tagline{font-size:13px;margin-top:12px;opacity:.9}
.wrap{max-width:760px;margin:0 auto;padding:16px 14px 44px}
.search{width:100%;padding:13px 15px;border:1px solid var(--line);border-radius:13px;font-size:16px;background:white;outline:none}
.chips{display:flex;gap:8px;overflow:auto;padding:13px 0 5px;scrollbar-width:none}
.chips button{white-space:nowrap;border:1px solid #dfe3ef;background:white;color:#3c4562;border-radius:999px;padding:9px 13px;font-size:13px}
.chips button.active{background:var(--navy);border-color:var(--navy);color:white}
.group{margin-top:18px}
.group h2{font-size:18px;margin:0 0 9px;padding:0 2px}
.item{background:white;border:1px solid var(--line);border-radius:13px;padding:11px;margin:8px 0;display:flex;align-items:center;gap:12px;box-shadow:0 2px 8px #17224a08}
.photo{width:76px;height:76px;flex:0 0 76px;border-radius:10px;object-fit:cover;background:#edf0f8;display:none}
.photo.visible{display:block}
.photo-placeholder{width:76px;height:76px;flex:0 0 76px;border-radius:10px;background:#edf0f8;display:flex;align-items:center;justify-content:center;color:#8992ad;font-size:25px}
.details{min-width:0;flex:1}
.name{font-size:15px;line-height:1.55;overflow-wrap:anywhere}
.price{font-size:15px;font-weight:750;white-space:nowrap;color:var(--navy);margin-top:4px}
.sold{display:inline-block;margin-top:5px;background:#fce8e6;color:#a12d22;border-radius:5px;padding:3px 7px;font-size:11px;font-weight:700}
.item.unavailable{opacity:.72}
.item.unavailable .price{text-decoration:line-through;color:#858b99}
.note{text-align:center;color:var(--muted);font-size:12px;margin:22px 0 0;line-height:1.8}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
footer{text-align:center;color:#778097;font-size:11px;padding:18px}
</style>
</head>
<body>
<header>
  <div class="brand">SALON14</div>
  <div class="sub">FOODS &amp; COLD DRINKS</div>
  <div class="tagline">Menu • Price List</div>
</header>
<main class="wrap">
  <input id="search" class="search" type="search" placeholder="Menu ရှာရန်..." aria-label="Search menu">
  <nav id="chips" class="chips" aria-label="Menu categories"></nav>
  <section id="menu"></section>
  <p class="note">မှာယူလိုပါက ဆိုင်ဝန်ထမ်းထံ ပြောကြားပေးပါ။<br>ကုန်နေသော Menu များကို “ကုန်နေပါပြီ” ဟု ဖော်ပြထားပါသည်။<br>Prices are shown in Myanmar Kyats (Ks).</p>
</main>
<footer>© Salon14 Foods &amp; Cold Drinks</footer>
<script src="./menu-data.js"></script>
<script>
const {items, categories} = window.SALON14_MENU;
let active = "အားလုံး";
const money = n => "Ks " + Number(n).toLocaleString("en-US");
const chips = document.getElementById("chips");
const menu = document.getElementById("menu");
const search = document.getElementById("search");
function renderChips(){
  chips.innerHTML = "";
  ["အားလုံး", ...categories].forEach(c => {
    const b=document.createElement("button");
    b.textContent=c; b.className=c===active?"active":"";
    b.onclick=()=>{active=c;renderChips();renderMenu();};
    chips.appendChild(b);
  });
}
function renderMenu(){
  const q=search.value.trim().toLocaleLowerCase();
  const filtered=items.filter(x=>(active==="အားလုံး"||x.category===active) && (x.name.toLocaleLowerCase().includes(q)||x.category.toLocaleLowerCase().includes(q)));
  menu.innerHTML="";
  if(!filtered.length){menu.innerHTML='<div class="empty">ရှာဖွေတွေ့ရှိမှု မရှိပါ။</div>';return;}
  [...new Set(filtered.map(x=>x.category))].forEach(cat=>{
    const section=document.createElement("section");section.className="group";
    const h=document.createElement("h2");h.textContent=cat;section.appendChild(h);
    filtered.filter(x=>x.category===cat).forEach(x=>{
      const row=document.createElement("div");row.className="item"+(x.available===false?" unavailable":"");
      if(x.image){
        const img=document.createElement("img");img.className="photo visible";img.src=x.image;img.alt=x.name;
        img.onerror=()=>{img.remove();};row.appendChild(img);
      } else {
        const ph=document.createElement("div");ph.className="photo-placeholder";ph.textContent="🍽";row.appendChild(ph);
      }
      const details=document.createElement("div");details.className="details";
      const n=document.createElement("div");n.className="name";n.textContent=x.name;
      const p=document.createElement("div");p.className="price";p.textContent=money(x.price);
      details.append(n,p);
      if(x.available===false){const s=document.createElement("span");s.className="sold";s.textContent="ကုန်နေပါပြီ";details.appendChild(s);}
      row.appendChild(details);section.appendChild(row);
    });
    menu.appendChild(section);
  });
}
search.addEventListener("input",renderMenu);
renderChips();renderMenu();
</script>
</body>
</html>
